{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Knowledge Assistant{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'knowledge/app.css' %}">
</head>
<body>
  <div class="grid"></div>
  <header class="topbar">
    <a href="{% url 'home' %}" class="brand"><span class="brand-mark">K</span><span>KNOWLEDGE</span><i>//</i> ASSISTANT</a>
    <div class="status"><span></span> READY TO HELP</div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>PRIVATE DOCUMENT QUESTION ANSWERING <span>•</span> CLEAR ANSWERS FROM YOUR FILES</footer>
</body>
</html>
