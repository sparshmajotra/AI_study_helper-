services:
  - type: web
    name: ai-study-helper
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-study-helper-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

databases:
  - name: ai-study-helper-db
    plan: free
